<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Portfolio">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:var(--bf);font-size:var(--fs);line-height:var(--lh)}
#site{position:relative;max-width:100%;margin:0 auto;padding:0}
a{color:var(--ac);text-decoration:none}a:hover{opacity:.8}a:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:3px}

/* Header/Nav */
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:24px 60px;background:var(--bg);border-bottom:1px solid var(--bd)}
.logo{font-size:20px;font-weight:bold;font-family:var(--hf)}
nav{display:flex;gap:40px;align-items:center}nav a{color:var(--tx);font-size:16px}nav a:hover{color:var(--ac)}
.social-icons{display:flex;gap:20px;margin-left:20px}

/* Hero */
.hero{display:flex;align-items:center;gap:60px;padding:80px 60px;min-height:600px}
.hero-image{flex:1;display:flex;justify-content:center}
.hero-image img{width:100%;max-width:460px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block}
.hero-content{flex:1.2}
.hero h1{font-family:var(--hf);font-size:clamp(2.6rem,6vw,5rem);line-height:1;margin:0 0 .35em;letter-spacing:-.02em;color:var(--tx)}
.hero p{font-size:var(--fs);line-height:var(--lh);opacity:.9;margin:0;max-width:600px}

/* About (centered) */
.about{padding:100px 60px;text-align:center}
.about h2{font-family:var(--hf);font-size:3rem;line-height:1.1;margin:0 0 .6em;color:var(--tx)}
.about p{font-size:calc(var(--fs)*1.15);line-height:var(--lh);opacity:.92;max-width:760px;margin:0 auto}

/* Projects */
.projects-section{padding:100px 60px}
.projects-section h2{font-family:var(--hf);font-size:3rem;margin:0 0 60px;color:var(--tx)}
.project{display:flex;align-items:center;gap:60px;margin-bottom:100px}
.project:nth-child(even){flex-direction:row-reverse}
.project-image{flex:0 0 380px;max-width:100%}
.project-image img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;display:block}
.project-content{flex:1}
.project-title{font-family:var(--hf);font-size:2.2rem;margin:0 0 20px;color:var(--tx)}
.project-desc{font-size:var(--fs);line-height:var(--lh);opacity:.9;margin:0;max-width:600px}

/* Contact */
.contact{padding:100px 60px;text-align:center;border-top:1px solid var(--bd)}
.contact h2{font-family:var(--hf);font-size:3rem;margin:0 0 .4em;color:var(--tx)}
.contact .intro{max-width:560px;margin:0 auto 40px;opacity:.9}
.cform{max-width:600px;margin:0 auto;text-align:left;display:grid;gap:18px}
.cform label{display:block;font-weight:600;font-size:.9em}
.cform input,.cform textarea{display:block;width:100%;margin-top:6px;padding:14px 16px;font:inherit;color:var(--tx);background:color-mix(in srgb,var(--tx) 8%,transparent);border:1px solid var(--bd);border-radius:8px}
.cform input::placeholder,.cform textarea::placeholder{color:var(--tx);opacity:.45}
.cform input:focus,.cform textarea:focus{outline:none;border-color:var(--ac)}
.cform textarea{min-height:150px;resize:vertical}
.cform button{justify-self:start;padding:14px 32px;font:inherit;font-weight:700;cursor:pointer;color:var(--bg);background:var(--ac);border:0;border-radius:8px}
.cform button:hover{opacity:.85}
.cstat{min-height:1.4em;margin:0;font-size:.9em}

/* Image placeholders */
.img-placeholder{
  width:100%;
  background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 25%,transparent),color-mix(in srgb,var(--ac) 6%,transparent));
  border:3px dashed color-mix(in srgb,var(--ac) 70%,transparent);
  display:flex;align-items:center;justify-content:center;
  color:var(--ac);font-size:48px;border-radius:8px;font-weight:bold;
  position:relative;overflow:hidden;
}
.img-placeholder::before{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 30%,color-mix(in srgb,var(--ac) 15%,transparent) 50%,transparent 70%);animation:shimmer 2s infinite;pointer-events:none}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.img-placeholder-text{position:relative;z-index:1;text-align:center}
.img-placeholder-text div:nth-child(2){font-size:14px;font-weight:600;margin-top:12px}
.img-placeholder-text div:nth-child(3){font-size:11px;opacity:.7;margin-top:6px}
.hero-image .img-placeholder{max-width:460px;aspect-ratio:3/4}
.project-image .img-placeholder{aspect-ratio:4/5}

/* Footer */
footer{padding:40px 60px;border-top:1px solid var(--bd);color:var(--mu);font-size:.85em;text-align:center}

/* Responsive */
@media(max-width:800px){
 header{flex-direction:column;gap:15px;padding:20px}nav{flex-wrap:wrap;justify-content:center;gap:20px}
 .hero{flex-direction:column;padding:40px 20px;gap:30px;min-height:0}
 .about,.projects-section,.contact{padding:60px 20px}
 .project{flex-direction:column!important;gap:30px;margin-bottom:60px}
 .project-image{flex:none;width:100%;max-width:380px}
 h2{font-size:2rem!important}
}

/* Editor */
#ed{display:none;position:fixed;top:0;right:0;bottom:0;width:360px;z-index:50;flex-direction:column;background:#f6f7f8;color:#1c2024;font:13px/1.4 system-ui,sans-serif;border-left:1px solid #c9ced3}
body.editing #ed{display:flex}body.editing{padding-right:360px}
#ed *{font-family:inherit}
.eh{padding:10px 14px;background:#fff;border-bottom:1px solid #d9dde1}
.eh b{font-size:14px}.btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#ed button{border:1px solid #b9c0c7;background:#fff;border-radius:5px;padding:5px 10px;cursor:pointer;font-size:12px;color:#1c2024}
#ed button:hover{background:#eceff2}#ed button.p{background:#0b5cad;border-color:#0b5cad;color:#fff}#ed button.on{background:#1c2024;color:#fff}
.eb{overflow:auto;flex:1;padding:4px 14px 40px}
#ed label{display:block;margin:9px 0;font-weight:600;font-size:12px}
#ed input:not([type=color],[type=checkbox],[type=range],[type=file]),#ed textarea,#ed select{display:block;width:100%;margin-top:3px;padding:6px 8px;border:1px solid #b9c0c7;border-radius:5px;background:#fff;font-weight:400;font-size:13px}
#ed input[type=color]{display:block;width:100%;height:30px;margin-top:3px;padding:0;border:1px solid #b9c0c7;border-radius:5px}
#ed input[type=range]{width:100%;display:block}#ed label.ck{display:flex;gap:8px;align-items:center}
#ed output{font-weight:400;color:#5a636c}
#ed .note{font-size:11px;color:#5a636c;margin:4px 0 8px}
details{background:#fff;border:1px solid #d9dde1;border-radius:6px;margin:8px 0;padding:0 10px}
details details{background:#f6f7f8}
summary{cursor:pointer;padding:9px 0;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ct{display:flex;gap:3px}.ct button{padding:2px 7px!important}
#ed h4{margin:14px 0 4px;font-size:12px;color:#5a636c}
@media(max-width:900px){body.editing{padding:0 0 55vh}#ed{top:auto;width:100%;height:55vh;border-left:0;border-top:1px solid #c9ced3}}
</style>
<style id="theme"></style>
</head>
<body class="">
<div id="site"></div>
<aside id="ed" aria-label="Portfolio editor"></aside>
<script id="data" type="application/json">{"theme":{"bg":"#0a2a5e","tx":"#eaf3ff","mu":"#a9c4da","ac":"#7fd1ff","hf":"Arial","bf":"Arial","fs":18,"lh":1.6,"logo":"Your Site Title"},"hero":{"title":"Hi! I'm [Your Name], and welcome to my portfolio!","bio":"I'm a mechE student at BU, and I am interested in [your interests here]","img":""},"about":{"title":"Your Story Here","text":"This is where you can tell your story. Write about your background, your journey, what inspires you, and what you're working towards. Make it personal and engaging!"},"projects":[{"title":"Project 1","desc":"Describe your first project here. What was the goal? What did you learn? What tools did you use?","img":""},{"title":"Project 2","desc":"Describe your second project here. What was the goal? What did you learn? What tools did you use?","img":""},{"title":"Project 3","desc":"Describe your third project here. What was the goal? What did you learn? What tools did you use?","img":""}],"contact":{"title":"Get in touch","intro":"Have a question or want to work together? Send me a message.","email":"you@example.com","endpoint":""},"footer":"© 2026 Your Name"}</script>
<script>
const $=s=>document.querySelector(s),ed=$('#ed');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o)),DEF=JSON.parse($('#data').textContent),KEY='portfolio-draft';
let S=clone(DEF),tab='style';const OPEN=new Set(['c']);
let EDIT=location.hash==='#edit';
const editing=()=>EDIT;
if(editing())try{const d=localStorage.getItem(KEY);if(d)S=JSON.parse(d)}catch(e){}
const get=p=>p.split('.').reduce((o,k)=>o?.[k],S);
const set=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
const FONTS=['Arial','Georgia','Courier New','Trebuchet MS','Verdana','Inter','DM Sans','Poppins','Oswald','Playfair Display','Merriweather'];
const PRE={Ocean:{bg:'#0a2a5e',tx:'#eaf3ff',mu:'#a9c4da',ac:'#7fd1ff'},Midnight:{bg:'#050d24',tx:'#e6eeff',mu:'#8fa3c8',ac:'#4d8dff'},'Sky (light)':{bg:'#e8f1ff',tx:'#0a2a5e',mu:'#4a638f',ac:'#1a73e8'}};

const F={
 t:(l,p,x='text')=>`<label>${l}<input type="${x}" data-p="${p}" value="${esc(get(p))}"></label>`,
 a:(l,p,r=3)=>`<label>${l}<textarea rows="${r}" data-p="${p}">${esc(get(p))}</textarea></label>`,
 r:(l,p,a,b,s=1)=>`<label>${l} <output>${get(p)}</output><input type="range" min="${a}" max="${b}" step="${s}" data-p="${p}" value="${get(p)}"></label>`,
 s:(l,p,o)=>`<label>${l}<select data-p="${p}">${o.map(x=>{const[v,n]=Array.isArray(x)?x:[x,x];return `<option value="${v}"${get(p)==v?' selected':''}>${n}</option>`}).join('')}</select></label>`,
 k:(l,p)=>`<label class="ck"><input type="checkbox" data-p="${p}"${get(p)?' checked':''}>${l}</label>`,
 i:(l,p)=>{const v=String(get(p)||'');return `<label>${l}<input data-p="${p}" placeholder="${v.startsWith('data:')?'(uploaded image)':'Image URL or upload below'}" value="${v.startsWith('data:')?'':esc(v)}"></label><div class="btns"><input type="file" accept="image/*" data-up="${p}"><button data-a="clr" data-p="${p}">Remove</button></div>`}};
const D=(k,title,body,ctl='')=>`<details data-k="${k}"${OPEN.has(k)?' open':''}><summary><span>${esc(title)}</span>${ctl}</summary>${body}</details>`;
const mv=(p,i)=>`<span class="ct"><button data-a="mv" data-p="${p}" data-i="${i}" data-d="-1" title="Move up">↑</button><button data-a="mv" data-p="${p}" data-i="${i}" data-d="1" title="Move down">↓</button><button data-a="rm" data-p="${p}" data-i="${i}" title="Delete">✕</button></span>`;

function site(){
 const t=S.theme,h=S.hero,a=S.about,c=S.contact;
 const nav=`<header><div class="logo">${esc(t.logo)}</div><nav><a href="#about">About</a><a href="#projects">Projects</a><a href="#contact">Contact</a><div class="social-icons"><a href="#">📷</a><a href="#">𝕏</a></div></nav></header>`;
 const hero=`<section class="hero"><div class="hero-image">${h.img?`<img src="${esc(h.img)}" alt="Profile">`:`<div class="img-placeholder"><div class="img-placeholder-text"><div>🖼️</div><div>HERO IMAGE</div><div>Vertical / portrait photo</div></div></div>`}</div><div class="hero-content"><h1>${esc(h.title)}</h1><p>${esc(h.bio)}</p></div></section>`;
 const about=`<section class="about" id="about"><h2>${esc(a.title)}</h2><p>${esc(a.text)}</p></section>`;
 const proj=S.projects.map((p,idx)=>`<article class="project"><div class="project-image">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.title)}">`:`<div class="img-placeholder"><div class="img-placeholder-text"><div>🖼️</div><div>PROJECT ${idx+1}</div><div>${esc(p.title)}</div></div></div>`}</div><div class="project-content"><h3 class="project-title">${esc(p.title)}</h3><p class="project-desc">${esc(p.desc)}</p></div></article>`).join('');
 const projects=`<section class="projects-section" id="projects"><h2>Projects</h2>${proj}</section>`;
 const contact=`<section class="contact" id="contact"><h2>${esc(c.title)}</h2><p class="intro">${esc(c.intro)}</p><form class="cform"><label>Name<input name="name" type="text" required placeholder="Your name"></label><label>Email<input name="email" type="email" required placeholder="you@example.com"></label><label>Message<textarea name="message" required placeholder="Write your message..."></textarea></label><button type="submit">Send message</button><p class="cstat" role="status"></p></form></section>`;
 $('#site').innerHTML=nav+hero+about+projects+contact+`<footer>${esc(S.footer)}</footer>`;
}
function theme(){
 const t=S.theme;
 $('#theme').textContent=`:root{--bg:${t.bg};--tx:${t.tx};--mu:${t.mu};--ac:${t.ac};--bd:color-mix(in srgb,${t.tx} 20%,transparent);--hf:'${t.hf}',system-ui,sans-serif;--bf:'${t.bf}',system-ui,sans-serif;--fs:${t.fs}px;--lh:${t.lh}}body{background:${t.bg}}`;
 const f=[...new Set([t.hf,t.bf])].filter(x=>x!='system-ui').map(x=>'family='+x.replace(/ /g,'+')+':wght@400;600;700').join('&');
 let l=$('#gf');if(!l){l=document.createElement('link');l.id='gf';l.rel='stylesheet';document.head.appendChild(l)}
 l.href=f?`https://fonts.googleapis.com/css2?${f}&display=swap`:''}
function upd(){try{if(editing())localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}theme();site()}

/* Smooth-scroll nav links (keeps #edit in the URL while editing) */
$('#site').addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();
 const id=a.getAttribute('href').slice(1);if(id)document.getElementById(id)?.scrollIntoView({behavior:'smooth'})});

/* Contact form: Formspree/endpoint if set, otherwise opens your email app */
$('#site').addEventListener('submit',async e=>{
 if(!e.target.matches('.cform'))return;e.preventDefault();
 const f=e.target,d=new FormData(f),n=d.get('name'),em=d.get('email'),m=d.get('message'),c=S.contact,st=f.querySelector('.cstat');
 if(c.endpoint){
  st.textContent='Sending...';
  try{const r=await fetch(c.endpoint,{method:'POST',headers:{Accept:'application/json'},body:d});
   if(r.ok){st.textContent='Thanks! Your message was sent.';f.reset()}else st.textContent='Something went wrong. Please try again.'}
  catch(x){st.textContent='Could not send. Please try again.'}
 }else{
  location.href=`mailto:${c.email}?subject=${encodeURIComponent('Portfolio message from '+n)}&body=${encodeURIComponent(m+'\n\n— '+n+' ('+em+')')}`;
  st.textContent='Opening your email app...';
 }});

function build(){
 const sc=$('.eb')?.scrollTop||0,T='theme.';
 const style=`<h4>Presets</h4><div class="btns">${Object.keys(PRE).map(k=>`<button data-a="pre" data-k="${k}">${k}</button>`).join('')}</div>`+
 D('c','Colors',F.t('Background',T+'bg','color')+F.t('Text',T+'tx','color')+F.t('Muted text',T+'mu','color')+F.t('Accent (buttons, placeholders)',T+'ac','color'))+
 D('f','Fonts & Size',F.s('Heading font',T+'hf',FONTS)+F.s('Body font',T+'bf',FONTS)+F.r('Text size (px)',T+'fs',14,24)+F.r('Line height',T+'lh',1.2,2,.1));

 const content=D('h','Header',F.t('Site title',T+'logo'))+
 D('a','Hero Section',F.t('Title','hero.title')+F.a('Bio','hero.bio',2)+F.i('Hero image (vertical)','hero.img'))+
 D('b','About / Story (centered)',F.t('Title','about.title')+F.a('Story text','about.text',5))+
 D('p','Projects',S.projects.map((p,i)=>{const q=`projects.${i}.`;
  return D(`p${i}`,p.title||'Project '+(i+1),F.t('Title',q+'title')+F.a('Description',q+'desc',3)+F.i('Project image (vertical)',q+'img'),mv('projects',i))}).join('')+
  `<div class="btns"><button data-a="add" data-p="projects">+ Add project</button></div>`)+
 D('ct','Contact Section',F.t('Title','contact.title')+F.a('Intro text','contact.intro',2)+F.t('Your email (messages go here)','contact.email','email')+F.t('Form endpoint URL (optional)','contact.endpoint')+`<p class="note">Leave the endpoint blank and the form opens the visitor's email app with the message filled in. Paste a Formspree URL to have messages delivered straight to your inbox instead.</p>`)+
 D('ft','Footer',F.t('Footer text','footer'));
 ed.innerHTML=`<div class="eh"><b>Portfolio editor</b><div class="btns"><button class="p" data-a="exp">Export</button><button data-a="rst">Reset</button><button data-a="x">Close</button></div><div class="btns"><button data-a="tab" data-k="style" class="${tab=='style'?'on':''}">Style</button><button data-a="tab" data-k="content" class="${tab=='content'?'on':''}">Content</button></div></div><div class="eb">${tab=='style'?style:content}</div>`;
 $('.eb').scrollTop=sc}

ed.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;
 set(p,t.type=='checkbox'?t.checked:t.type=='range'?+t.value:t.value);
 const o=t.parentNode.querySelector('output');if(o)o.textContent=t.value;upd()});
ed.addEventListener('change',e=>{const t=e.target,p=t.dataset.up;if(!p||!t.files[0])return;
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);set(p,c.toDataURL('image/jpeg',.85));upd();build()};im.src=r.result};r.readAsDataURL(t.files[0])});
ed.addEventListener('toggle',e=>{const d=e.target,k=d.dataset?.k;if(k)d.open?OPEN.add(k):OPEN.delete(k)},true);
ed.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;e.preventDefault();
 const{a,p,i,d,k}=b.dataset;
 if(a=='exp')return exp();
 if(a=='x'){history.replaceState(null,'',location.pathname);EDIT=false;document.body.classList.remove('editing');return}
 if(a=='tab')tab=k;
 if(a=='pre')Object.assign(S.theme,PRE[k]);
 if(a=='mv'){const A=get(p),j=+i+ +d;if(A[j])[A[i],A[j]]=[A[j],A[i]]}
 if(a=='rm')get(p).splice(i,1);
 if(a=='clr')set(p,'');
 if(a=='add')get(p).push({title:'New project',desc:'Add description',img:''});
 if(a=='rst'){if(!confirm('Discard all edits and go back to the saved version?'))return;S=clone(DEF);try{localStorage.removeItem(KEY)}catch(x){}}
 upd();build()});

function exp(){
 const d=document.documentElement.cloneNode(true);
 d.querySelector('#site').innerHTML='';
 d.querySelector('#ed').innerHTML='';d.querySelector('#theme').textContent='';
 d.querySelector('#gf')?.remove();
 d.querySelector('body').className='';
 d.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+d.outerHTML],{type:'text/html'}));
 a.download='portfolio.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function open(){if(location.hash==='#edit'){EDIT=true;try{const d=localStorage.getItem(KEY);if(d)S=JSON.parse(d)}catch(e){}document.body.classList.add('editing');upd();build()}}
addEventListener('hashchange',open);
upd();open();
</script>
</body>
</html>
