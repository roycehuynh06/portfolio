<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royce Huynh | Mechanical Engineering Portfolio</title>
<meta name="description" content="Portfolio of Royce Huynh, Mechanical Engineering student at Boston University.">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:var(--bf);font-size:var(--fs);line-height:var(--lh)}
#site{position:relative}
a{color:var(--ac);text-decoration:none}a:hover{opacity:.8}a:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:3px}

/* Header */
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 60px;background:var(--bg);border-bottom:1px solid var(--bd)}
.logo{font-size:20px;font-weight:bold;font-family:var(--hf);color:var(--tx)}
nav{display:flex;gap:32px;align-items:center;flex-wrap:wrap}
nav a{color:var(--tx);font-size:16px;padding:4px 0;border-bottom:2px solid transparent}
nav a:hover{opacity:1;border-color:var(--bd)}nav a.on{border-color:var(--ac)}
nav a.soc{color:var(--ac)}

/* Buttons */
.btn{display:inline-block;padding:10px 20px;border:1px solid var(--ac);border-radius:8px;color:var(--ac);font-weight:700}
.btn:hover{background:var(--ac);color:var(--bg);opacity:1}

/* Hero */
.hero{display:flex;align-items:center;gap:60px;padding:80px 60px;min-height:600px}
.hero-image{flex:1;display:flex;justify-content:center}
.hero-image img{width:100%;max-width:460px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block}
.hero-content{flex:1.2}
.hero h1{font-family:var(--hf);font-size:clamp(2.6rem,6vw,5rem);line-height:1;margin:0 0 .35em;letter-spacing:-.02em}
.hero p{margin:0;max-width:600px;opacity:.9}

/* About (centered) */
.about{padding:100px 60px;text-align:center}
.about h2{font-family:var(--hf);font-size:3rem;line-height:1.1;margin:0 0 .6em}
.about p{font-size:calc(var(--fs)*1.15);opacity:.92;max-width:760px;margin:0 auto 1em}

/* Shared section */
.sec{padding:100px 60px}
.sec>.wrap>h2{font-family:var(--hf);font-size:3rem;line-height:1.1;margin:0 0 60px}
.wrap{max-width:1100px;margin:0 auto}
.rintro{max-width:68ch;margin:-30px 0 40px;opacity:.9}
.cta{margin:0;text-align:center}

/* Featured projects (home): alternating image left / right */
.project{display:flex;align-items:center;gap:60px;margin-bottom:100px}
.project:nth-of-type(even){flex-direction:row-reverse}
.project-image{flex:0 0 380px;max-width:100%}
.project-image img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;display:block}
.project-content{flex:1}
.project-title{font-family:var(--hf);font-size:2.2rem;line-height:1.1;margin:0 0 8px}
.pmeta{color:var(--mu);margin:0 0 16px;font-size:.9em}
.project-content ul,.xr ul,.cb ul,.res-body ul{margin:0;padding-left:1.2em}
.project-content li,.xr li,.cb li{margin:.4em 0;opacity:.92}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.tags span{font-size:.8em;padding:3px 12px;border:1px solid var(--bd);border-radius:99px;color:var(--mu)}
.plink{margin:18px 0 0}

/* Resume */
.rbtns{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 20px}
.rframe{display:block;width:100%;height:850px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.rph{min-height:320px;max-width:640px}

/* Skills rows */
.xrow{display:grid;grid-template-columns:1fr 1.4fr;gap:60px;padding:36px 0;border-top:1px solid var(--bd)}
.xrow:last-child{border-bottom:1px solid var(--bd)}
.xl h3{font-family:var(--hf);font-size:1.5rem;line-height:1.15;margin:0 0 6px}
.xr .tags{margin:0}

/* Projects & CAD page */
.phead{padding:90px 60px 0}
.phead h1{font-family:var(--hf);font-size:clamp(2.4rem,6vw,4.4rem);line-height:1;margin:0 0 .4em;letter-spacing:-.02em}
.phead p{max-width:68ch;opacity:.9;margin:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.pcard{background:color-mix(in srgb,var(--tx) 6%,transparent);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.pcard>img,.pcard>.img-placeholder{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:0}
.pcard .cb{padding:20px}
.pcard h3{font-family:var(--hf);font-size:1.4rem;line-height:1.15;margin:0 0 6px}
.res{display:grid;grid-template-columns:260px 1fr;gap:40px;align-items:center;padding:36px 0;border-top:1px solid var(--bd)}
.res:last-child{border-bottom:1px solid var(--bd)}
.res-img img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.res-img .img-placeholder{aspect-ratio:4/3}
.res-body h3{font-family:var(--hf);font-size:1.6rem;line-height:1.15;margin:0 0 6px}
.res-body p{margin:.4em 0}
.rtype{color:var(--mu);font-size:.85em;text-transform:uppercase;letter-spacing:.06em}

/* Contact */
.contact{padding:100px 60px;text-align:center;border-top:1px solid var(--bd)}
.contact h2{font-family:var(--hf);font-size:3rem;margin:0 0 .4em}
.contact .intro{max-width:560px;margin:0 auto 40px;opacity:.9}
.cform{max-width:600px;margin:0 auto;text-align:left;display:grid;gap:18px}
.cform label{display:block;font-weight:600;font-size:.9em}
.cform input,.cform textarea{display:block;width:100%;margin-top:6px;padding:14px 16px;font:inherit;color:var(--tx);background:color-mix(in srgb,var(--tx) 8%,transparent);border:1px solid var(--bd);border-radius:8px}
.cform input::placeholder,.cform textarea::placeholder{color:var(--tx);opacity:.45}
.cform input:focus,.cform textarea:focus{outline:none;border-color:var(--ac)}
.cform textarea{min-height:150px;resize:vertical}
.cform button{justify-self:start;padding:14px 32px;font:inherit;font-weight:700;cursor:pointer;color:var(--bg);background:var(--ac);border:0;border-radius:8px}
.cform button:hover{opacity:.85}
.cstat{min-height:1.4em;margin:0;font-size:.9em}

/* Image placeholders */
.img-placeholder{width:100%;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 25%,transparent),color-mix(in srgb,var(--ac) 6%,transparent));border:3px dashed color-mix(in srgb,var(--ac) 70%,transparent);display:flex;align-items:center;justify-content:center;color:var(--ac);font-size:48px;border-radius:8px;font-weight:bold;position:relative;overflow:hidden}
.img-placeholder::before{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 30%,color-mix(in srgb,var(--ac) 15%,transparent) 50%,transparent 70%);animation:shimmer 2s infinite;pointer-events:none}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.img-placeholder-text{position:relative;z-index:1;text-align:center;padding:10px}
.img-placeholder-text div:nth-child(2){font-size:14px;font-weight:600;margin-top:12px}
.img-placeholder-text div:nth-child(3){font-size:11px;opacity:.7;margin-top:6px}
.hero-image .img-placeholder{max-width:460px;aspect-ratio:3/4}
.project-image .img-placeholder{aspect-ratio:4/5}

footer{padding:40px 60px;border-top:1px solid var(--bd);color:var(--mu);font-size:.85em;text-align:center}

@media(max-width:800px){
 header{flex-direction:column;gap:15px;padding:20px}nav{justify-content:center;gap:18px}
 .hero{flex-direction:column;padding:40px 20px;gap:30px;min-height:0}
 .about,.sec,.contact{padding:60px 20px}.phead{padding:50px 20px 0}
 .project{flex-direction:column!important;gap:30px;margin-bottom:60px}
 .project-image{flex:none;width:100%;max-width:380px}
 .xrow,.res{grid-template-columns:1fr;gap:14px}
 .rframe{height:520px}
 h2{font-size:2rem!important}
}

/* Edit button (only shows when opened from your computer) */
#fab{display:none;position:fixed;right:20px;bottom:20px;z-index:40;padding:12px 18px;border:0;border-radius:99px;background:#0b5cad;color:#fff;font:600 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
body.local #fab{display:block}body.editing #fab{display:none}

/* Editor */
#ed{display:none;position:fixed;top:0;right:0;bottom:0;width:360px;z-index:50;flex-direction:column;background:#f6f7f8;color:#1c2024;font:13px/1.4 system-ui,sans-serif;border-left:1px solid #c9ced3}
body.editing #ed{display:flex}body.editing{padding-right:360px}
#ed *{font-family:inherit}
.eh{padding:10px 14px;background:#fff;border-bottom:1px solid #d9dde1}
.eh b{font-size:14px}.btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#ed button{border:1px solid #b9c0c7;background:#fff;border-radius:5px;padding:5px 10px;cursor:pointer;font-size:12px;color:#1c2024}
#ed button:hover{background:#eceff2}#ed button.p{background:#0b5cad;border-color:#0b5cad;color:#fff}#ed button.on{background:#1c2024;color:#fff}
.eb{overflow:auto;flex:1;padding:4px 14px 40px}
#ed label{display:block;margin:9px 0;font-weight:600;font-size:12px}
#ed input:not([type=color],[type=checkbox],[type=range],[type=file]),#ed textarea,#ed select{display:block;width:100%;margin-top:3px;padding:6px 8px;border:1px solid #b9c0c7;border-radius:5px;background:#fff;color:#1c2024;font-weight:400;font-size:13px}
#ed input[type=color]{display:block;width:100%;height:30px;margin-top:3px;padding:0;border:1px solid #b9c0c7;border-radius:5px}
#ed input[type=range]{width:100%;display:block}
#ed output{font-weight:400;color:#5a636c}
#ed .note{font-size:11px;color:#5a636c;margin:4px 0 8px}
#ed #savestat{font-size:11px;color:#b3261e;margin:4px 0 0}
details{background:#fff;border:1px solid #d9dde1;border-radius:6px;margin:8px 0;padding:0 10px}
details details{background:#f6f7f8}
summary{cursor:pointer;padding:9px 0;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ct{display:flex;gap:3px}.ct button{padding:2px 7px!important}
#ed h4{margin:14px 0 4px;font-size:12px;color:#5a636c}
@media(max-width:900px){body.editing{padding:0 0 55vh}#ed{top:auto;width:100%;height:55vh;border-left:0;border-top:1px solid #c9ced3}}
</style>

<script>
const $=s=>document.querySelector(s),ed=$('#ed');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o)),DEF=JSON.parse($('#data').textContent),KEY='portfolio-draft-v4';
const lines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
const chips=t=>String(t||'').split(',').map(x=>x.trim()).filter(Boolean);
/* Makes "www.site.com" work as a link and blocks javascript: links */
const fixUrl=u=>{u=String(u||'').trim();if(!u)return '';if(/^(javascript|data|vbscript):/i.test(u))return '#';
 if(/^[a-z][a-z0-9+.-]*:/i.test(u)||/^[/#.]/.test(u))return u;
 if(/^(www\.|[\w-]+\.(com|org|net|io|edu|dev|me|co)\b)/i.test(u))return 'https://'+u;return u};
/* Turns an uploaded (base64) file into a temporary blob: URL so the PDF viewer can display it */
const BLOBS=new Map();
function blobUrl(d){if(!d)return '';if(!d.startsWith('data:'))return d;if(BLOBS.has(d))return BLOBS.get(d);
 try{const i=d.indexOf(','),m=(d.slice(5,i).split(';')[0])||'application/pdf',bin=atob(d.slice(i+1)),u8=new Uint8Array(bin.length);
  for(let k=0;k<bin.length;k++)u8[k]=bin.charCodeAt(k);
  const url=URL.createObjectURL(new Blob([u8],{type:m}));BLOBS.set(d,url);return url}catch(e){return ''}}

let S=clone(DEF),tab='style',EDIT=false,PAGE='home',SAVEERR=false;const OPEN=new Set(['c']);
const get=p=>p.split('.').reduce((o,k)=>o?.[k],S);
const set=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
const FONTS=['Arial','Georgia','Courier New','Trebuchet MS','Verdana','Inter','DM Sans','Poppins','Oswald','Playfair Display','Merriweather'];
const SYS=['Arial','Georgia','Courier New','Trebuchet MS','Verdana','system-ui'];
const PRE={Slate:{bg:'#293851',tx:'#c6d4e7',mu:'#add5f5',ac:'#fafafa'},Ocean:{bg:'#0a2a5e',tx:'#eaf3ff',mu:'#a9c4da',ac:'#7fd1ff'},Midnight:{bg:'#050d24',tx:'#e6eeff',mu:'#8fa3c8',ac:'#4d8dff'},'Sky (light)':{bg:'#e8f1ff',tx:'#0a2a5e',mu:'#4a638f',ac:'#1a73e8'}};
const ADD={'projects.items':{title:'New project',date:'',desc:'Add details',tags:'',link:'',linkLabel:'View details →',img:''},
 'resources.items':{title:'New resource',type:'',desc:'',link:'',linkLabel:'Open files →',img:''},
 'skills.items':{title:'New category',tags:''}};

const F={
 t:(l,p,x='text')=>`<label>${l}<input type="${x}" data-p="${p}" value="${esc(get(p))}"></label>`,
 a:(l,p,r=3)=>`<label>${l}<textarea rows="${r}" data-p="${p}">${esc(get(p))}</textarea></label>`,
 r:(l,p,a,b,s=1)=>`<label>${l} <output>${get(p)}</output><input type="range" min="${a}" max="${b}" step="${s}" data-p="${p}" value="${get(p)}"></label>`,
 s:(l,p,o)=>`<label>${l}<select data-p="${p}">${o.map(x=>`<option value="${esc(x)}"${get(p)==x?' selected':''}>${esc(x)}</option>`).join('')}</select></label>`,
 i:(l,p)=>{const v=String(get(p)||'');return `<label>${l}<input data-p="${p}" placeholder="${v.startsWith('data:')?'(uploaded image)':'Image URL or upload below'}" value="${v.startsWith('data:')?'':esc(v)}"></label><div class="btns"><input type="file" accept="image/*" data-up="${p}"><button data-a="clr" data-p="${p}">Remove</button></div>`},
 pdf:()=>`<p class="note">${S.resume.file?'Uploaded: '+esc(S.resume.name):'No PDF uploaded yet.'}</p><div class="btns"><input type="file" accept="application/pdf,.pdf" data-pdf="1"><button data-a="clrpdf">Remove</button></div>`};
const D=(k,title,body,ctl='')=>`<details data-k="${k}"${OPEN.has(k)?' open':''}><summary><span>${esc(title)}</span>${ctl}</summary>${body}</details>`;
const mv=(p,i)=>`<span class="ct"><button data-a="mv" data-p="${p}" data-i="${i}" data-d="-1" title="Move up">↑</button><button data-a="mv" data-p="${p}" data-i="${i}" data-d="1" title="Move down">↓</button><button data-a="rm" data-p="${p}" data-i="${i}" title="Delete">✕</button></span>`;
const ul=t=>{const l=lines(t);return l.length?`<ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''};
const tg=t=>{const c=chips(t);return c.length?`<p class="tags">${c.map(x=>`<span>${esc(x)}</span>`).join('')}</p>`:''};
const ph=(a,b)=>`<div class="img-placeholder"><div class="img-placeholder-text"><div>🖼️</div><div>${esc(a)}</div><div>${esc(b)}</div></div></div>`;
const pic=(src,alt,a,b)=>src?`<img src="${esc(src)}" alt="${esc(alt)}">`:ph(a,b);
const lnk=(u,l)=>u?`<p class="plink"><a class="btn" href="${esc(fixUrl(u))}" target="_blank" rel="noopener">${esc(l||'Open →')}</a></p>`:'';

/* Only re-renders sections whose content changed, so the resume viewer and big photos don't flash while you type */
function mount(parts){
 const host=$('#site');
 parts.forEach(([k,html],i)=>{
  const cur=host.children[i];
  if(cur&&cur.dataset.k===k&&cur._h===html)return;
  const tp=document.createElement('template');tp.innerHTML=html;
  const el=tp.content.firstElementChild;el.dataset.k=k;el._h=html;
  cur?host.replaceChild(el,cur):host.appendChild(el)});
 while(host.children.length>parts.length)host.lastElementChild.remove()}

function site(){
 const t=S.theme,h=S.hero,a=S.about,c=S.contact,P=S.projects,G=S.page2,R=S.resume,K=S.skills,X=S.resources;
 const soc=[['LinkedIn',t.linkedin],['GitHub',t.github],['Instagram',t.instagram]].filter(x=>x[1]).map(x=>`<a class="soc" href="${esc(fixUrl(x[1]))}" target="_blank" rel="noopener">${x[0]}</a>`).join('');
 const hdr=['hdr',`<header><a class="logo" href="#home" data-page="home">${esc(t.logo)}</a><nav><a href="#projects" data-page="projects" class="${PAGE=='projects'?'on':''}">${esc(t.navLabel)}</a>${soc}</nav></header>`];
 const ftr=['ftr',`<footer>${esc(S.footer)}</footer>`];

 if(PAGE=='projects'){
  const head=['p2head',`<section class="phead"><div class="wrap"><h1>${esc(G.title)}</h1><p>${esc(G.intro)}</p></div></section>`];
  const all=['allp',`<section class="sec"><div class="wrap"><h2>${esc(G.allTitle)}</h2><div class="pgrid">${P.items.map((p,i)=>`<article class="pcard">${pic(p.img,p.title,'PROJECT '+(i+1),p.title)}<div class="cb"><h3>${esc(p.title)}</h3><p class="pmeta">${esc(p.date)}</p>${ul(p.desc)}${tg(p.tags)}${lnk(p.link,p.linkLabel)}</div></article>`).join('')}</div></div></section>`];
  const res=['res',`<section class="sec"><div class="wrap"><h2>${esc(X.title)}</h2>${X.intro?`<p class="rintro">${esc(X.intro)}</p>`:''}${X.items.map(r=>`<article class="res"><div class="res-img">${pic(r.img,r.title,'CAD / RESOURCE',r.title)}</div><div class="res-body">${r.type?`<div class="rtype">${esc(r.type)}</div>`:''}<h3>${esc(r.title)}</h3>${r.desc?`<p>${esc(r.desc)}</p>`:''}${lnk(r.link,r.linkLabel)}</div></article>`).join('')}</div></section>`];
  mount([hdr,head,all,res,ftr]);return}

 const hero=['hero',`<section class="hero"><div class="hero-image">${h.img?`<img src="${esc(h.img)}" alt="Portrait of ${esc(t.logo)}">`:ph('HERO IMAGE','Vertical / portrait photo')}</div><div class="hero-content"><h1>${esc(h.title)}</h1><p>${esc(h.bio)}</p></div></section>`];
 const about=['about',`<section class="about"><h2>${esc(a.title)}</h2>${lines(a.text).map(p=>`<p>${esc(p)}</p>`).join('')}</section>`];
 const feat=['feat',`<section class="sec"><div class="wrap"><h2>${esc(P.title)}</h2>${P.items.slice(0,P.featured).map((p,i)=>`<article class="project"><div class="project-image">${pic(p.img,p.title,'PROJECT '+(i+1),p.title)}</div><div class="project-content"><h3 class="project-title">${esc(p.title)}</h3><p class="pmeta">${esc(p.date)}</p>${ul(p.desc)}${tg(p.tags)}${lnk(p.link,p.linkLabel)}</div></article>`).join('')}<p class="cta"><a class="btn" href="#projects" data-page="projects">${esc(P.cta)}</a></p></div></section>`];
 const u=blobUrl(R.file);
 const resume=['resume',`<section class="sec"><div class="wrap"><h2>${esc(R.title)}</h2>${R.intro?`<p class="rintro">${esc(R.intro)}</p>`:''}${u?`<div class="rbtns"><a class="btn" href="${u}" target="_blank" rel="noopener">Open in new tab</a><a class="btn" href="${u}" download="${esc(R.name||'resume.pdf')}">Download PDF</a></div><iframe class="rframe" src="${u}#view=FitH" title="Resume"></iframe>`:`<div class="img-placeholder rph"><div class="img-placeholder-text"><div>📄</div><div>RESUME</div><div>Upload a PDF in the editor (Content → Resume)</div></div></div>`}</div></section>`];
 const skills=['skills',`<section class="sec"><div class="wrap"><h2>${esc(K.title)}</h2>${K.items.map(x=>`<article class="xrow"><div class="xl"><h3>${esc(x.title)}</h3></div><div class="xr">${tg(x.tags)}</div></article>`).join('')}</div></section>`];
 const contact=['contact',`<section class="contact"><h2>${esc(c.title)}</h2><p class="intro">${esc(c.intro)}</p><form class="cform"><label>Name<input name="name" type="text" required placeholder="Your name"></label><label>Email<input name="email" type="email" required placeholder="you@example.com"></label><label>Message<textarea name="message" required placeholder="Write your message..."></textarea></label><button type="submit">Send message</button><p class="cstat" role="status"></p></form></section>`];
 mount([hdr,hero,about,feat,resume,skills,contact,ftr]);
}

function theme(){
 const t=S.theme;
 $('#theme').textContent=`:root{--bg:${t.bg};--tx:${t.tx};--mu:${t.mu};--ac:${t.ac};--bd:color-mix(in srgb,${t.tx} 20%,transparent);--hf:'${t.hf}',system-ui,sans-serif;--bf:'${t.bf}',system-ui,sans-serif;--fs:${t.fs}px;--lh:${t.lh}}body{background:${t.bg}}`;
 /* only ask Google for real Google fonts (system fonts in the request make the whole request fail) */
 const f=[...new Set([t.hf,t.bf])].filter(x=>!SYS.includes(x)).map(x=>'family='+x.replace(/ /g,'+')+':wght@400;700').join('&');
 let l=$('#gf');if(!l){l=document.createElement('link');l.id='gf';l.rel='stylesheet';document.head.appendChild(l)}
 l.href=f?`https://fonts.googleapis.com/css2?${f}&display=swap`:''}
function stat(){const el=$('#savestat');if(el)el.textContent=SAVEERR?'⚠ Draft is too big to autosave in this browser. Click Export now to keep your changes.':''}
function upd(){if(EDIT){try{localStorage.setItem(KEY,JSON.stringify(S));SAVEERR=false}catch(e){SAVEERR=true}}theme();site();stat()}

/* Page links: home <-> projects page. Edit mode swaps pages without touching the URL. */
function go(p){PAGE=p;if(EDIT){site();window.scrollTo(0,0)}else if(location.hash.slice(1).toLowerCase()===p)route();else location.hash=p}
$('#site').addEventListener('click',e=>{const a=e.target.closest('a[data-page]');if(!a)return;e.preventDefault();go(a.dataset.page)});

/* Contact form: uses endpoint (e.g. Formspree) if set, else opens email app */
$('#site').addEventListener('submit',async e=>{
 if(!e.target.matches('.cform'))return;e.preventDefault();
 const f=e.target,d=new FormData(f),n=d.get('name'),em=d.get('email'),m=d.get('message'),c=S.contact,st=f.querySelector('.cstat');
 if(c.endpoint){
  st.textContent='Sending...';
  try{const r=await fetch(c.endpoint,{method:'POST',headers:{Accept:'application/json'},body:d});
   if(r.ok){st.textContent='Thanks! Your message was sent.';f.reset()}else st.textContent='Something went wrong. Please try again.'}
  catch(x){st.textContent='Could not send. Please try again.'}
 }else{
  location.href=`mailto:${c.email}?subject=${encodeURIComponent('Portfolio message from '+n)}&body=${encodeURIComponent(m+'\n\n— '+n+' ('+em+')')}`;
  st.textContent='Opening your email app...';
 }});

function build(){
 const sc=$('.eb')?.scrollTop||0,T='theme.';
 const style=`<h4>Presets</h4><div class="btns">${Object.keys(PRE).map(k=>`<button data-a="pre" data-k="${esc(k)}">${esc(k)}</button>`).join('')}</div>`+
 D('c','Colors',F.t('Background',T+'bg','color')+F.t('Text',T+'tx','color')+F.t('Muted text',T+'mu','color')+F.t('Accent (buttons, placeholders)',T+'ac','color'))+
 D('f','Fonts & Size',F.s('Heading font',T+'hf',FONTS)+F.s('Body font',T+'bf',FONTS)+F.r('Text size (px)',T+'fs',14,24)+F.r('Line height',T+'lh',1.2,2,.1));

 const list=(key,title,head,fields,lab,note)=>D(key,title,head+(note?`<p class="note">${note}</p>`:'')+
  get(key+'.items').map((x,i)=>D(`${key}${i}`,lab(x,i),fields(`${key}.items.${i}.`),mv(key+'.items',i))).join('')+
  `<div class="btns"><button data-a="add" data-p="${key}.items">+ Add</button></div>`);

 const content=
 D('h','Header & links',F.t('Site title','theme.logo')+F.t('Header link to the projects page','theme.navLabel')+F.t('LinkedIn URL (optional)','theme.linkedin')+F.t('GitHub URL (optional)','theme.github')+F.t('Instagram URL (optional)','theme.instagram'))+
 '<h4>Home page</h4>'+
 D('hero','Hero',F.t('Title','hero.title')+F.a('Bio','hero.bio',3)+F.i('Hero image (vertical)','hero.img'))+
 D('about','About (centered)',F.t('Title','about.title')+F.a('Text (one paragraph per line)','about.text',7))+
 D('fp','Featured projects section',F.t('Section title','projects.title')+F.r('How many to show (from top of the list)','projects.featured',1,6)+F.t('Button text','projects.cta'))+
 D('rs','Resume (PDF)',F.t('Section title','resume.title')+F.a('Intro text','resume.intro',2)+F.pdf())+
 list('skills','Skills',F.t('Section title','skills.title'),q=>F.t('Category',q+'title')+F.a('Skills (comma separated)',q+'tags',3),x=>x.title||'Category','')+
 D('ct','Contact',F.t('Title','contact.title')+F.a('Intro text','contact.intro',2)+F.t('Your email','contact.email','email')+F.t('Form endpoint URL (optional)','contact.endpoint')+`<p class="note">Leave the endpoint blank and the form opens the visitor's email app. Paste a Formspree URL to get messages in your inbox instead.</p>`)+
 '<h4>Projects & CAD page</h4>'+
 D('pp','Page heading',F.t('Title','page2.title')+F.a('Intro','page2.intro',3)+F.t('"All projects" heading','page2.allTitle'))+
 list('projects','All projects','',q=>F.t('Title',q+'title')+F.t('Date / role',q+'date')+F.a('Details (one bullet per line)',q+'desc',5)+F.t('Tags (comma separated)',q+'tags')+F.t('Link (CAD, GitHub, video… optional)',q+'link')+F.t('Link button text',q+'linkLabel')+F.i('Image (vertical)',q+'img'),(x,i)=>(i<S.projects.featured?'★ ':'')+(x.title||'Project'),'★ = shown on the home page. Use ↑ ↓ to reorder; the top ones are featured.')+
 list('resources','CAD files & resources',F.t('Section title','resources.title')+F.a('Intro (optional)','resources.intro',2),q=>F.t('Title',q+'title')+F.t('Type (e.g. SolidWorks / STEP)',q+'type')+F.a('Description',q+'desc',3)+F.t('Link to the files',q+'link')+F.t('Link button text',q+'linkLabel')+F.i('Image / render',q+'img'),x=>x.title||'Resource','Link to Google Drive, GitHub, GrabCAD, Onshape, etc.')+
 D('ft','Footer',F.t('Footer text','footer'));

 ed.innerHTML=`<div class="eh"><b>Portfolio editor</b><div class="btns"><button class="p" data-a="exp">Export</button><button data-a="rst">Reset</button><button data-a="x">Close</button></div><div class="btns"><button data-a="tab" data-k="style" class="${tab=='style'?'on':''}">Style</button><button data-a="tab" data-k="content" class="${tab=='content'?'on':''}">Content</button></div><div id="savestat"></div></div><div class="eb">${tab=='style'?style:content}</div>`;
 $('.eb').scrollTop=sc;stat()}

ed.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;
 set(p,t.type=='range'?+t.value:t.value);
 const o=t.parentNode.querySelector('output');if(o)o.textContent=t.value;upd()});
ed.addEventListener('change',e=>{const t=e.target,f=t.files&&t.files[0];if(!f)return;
 if(t.dataset.up){const p=t.dataset.up,r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);set(p,c.toDataURL('image/jpeg',.85));upd();build()};im.src=r.result};r.readAsDataURL(f)}
 else if(t.dataset.pdf){
  if(!/pdf/i.test(f.type)&&!/\.pdf$/i.test(f.name)){alert('Please choose a PDF file.');t.value='';return}
  if(f.size>3e6&&!confirm('This PDF is over 3 MB and may be too big to autosave in your browser. Continue?')){t.value='';return}
  const r=new FileReader();r.onload=()=>{S.resume.file=r.result;S.resume.name=f.name;upd();build()};r.readAsDataURL(f)}});
ed.addEventListener('toggle',e=>{const d=e.target,k=d.dataset?.k;if(k)d.open?OPEN.add(k):OPEN.delete(k)},true);
ed.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;e.preventDefault();
 const{a,p,i,d,k}=b.dataset;
 if(a=='exp')return exp();
 if(a=='x'){history.replaceState(null,'',location.pathname+(PAGE=='projects'?'#projects':''));EDIT=false;document.body.classList.remove('editing');return}
 if(a=='tab')tab=k;
 if(a=='pre')Object.assign(S.theme,PRE[k]);
 if(a=='mv'){const A=get(p),x=+i,j=x+ +d;if(A[j])[A[x],A[j]]=[A[j],A[x]]}
 if(a=='rm')get(p).splice(+i,1);
 if(a=='clr')set(p,'');
 if(a=='clrpdf'){S.resume.file='';S.resume.name='resume.pdf'}
 if(a=='add')get(p).push(clone(ADD[p]));
 if(a=='rst'){if(!confirm('Discard all edits and go back to the saved version?'))return;S=clone(DEF);try{localStorage.removeItem(KEY)}catch(x){}}
 upd();build()});

function exp(){
 const d=document.documentElement.cloneNode(true);
 d.querySelector('#site').innerHTML='';d.querySelector('#ed').innerHTML='';d.querySelector('#theme').textContent='';
 d.querySelector('#gf')?.remove();d.querySelector('body').className='';
 d.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+d.outerHTML],{type:'text/html'}));
 a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function startEdit(){
 EDIT=true;
 try{const d=localStorage.getItem(KEY);if(d)S=Object.assign(clone(DEF),JSON.parse(d))}catch(e){}
 document.body.classList.add('editing');upd();build()}
function route(){
 const h=location.hash.slice(1).toLowerCase();
 if(h==='projects')PAGE='projects';else if(h===''||h==='home')PAGE='home';
 if((h.includes('edit')||/[?&]edit\b/.test(location.search))&&!EDIT)startEdit();else{theme();site()}
 if(!h.includes('edit'))window.scrollTo(0,0)}

if(location.protocol==='file:')document.body.classList.add('local');
$('#fab').addEventListener('click',()=>{location.hash='#edit'});
addEventListener('hashchange',route);
route();
</script>
</body></html>
