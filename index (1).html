<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:var(--bf);font-size:var(--fs);line-height:var(--lh)}
body.grid::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(color-mix(in srgb,var(--ac) 13%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ac) 13%,transparent) 1px,transparent 1px);background-size:32px 32px}
#site{position:relative;max-width:var(--w);margin:0 auto;padding:0 24px 64px}
a{color:var(--ac)}a:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:20px;flex-wrap:wrap;padding:14px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
nav a{color:var(--mu);text-decoration:none;font-size:.9em}nav a:hover{color:var(--ac)}
.hero{padding:calc(var(--sp)*1.3) 0 var(--sp)}
.hero h1{font-family:var(--hf);font-size:clamp(2.6rem,8vw,5.2rem);line-height:.98;margin:0 0 .25em;letter-spacing:-.02em}
.sub{font-family:var(--hf);font-size:1.25em;margin:0 0 1em;color:var(--ac)}
.bio{max-width:58ch;color:var(--mu);font-size:1.1em;margin:0 0 1.4em}
.links{display:flex;gap:12px;flex-wrap:wrap}
.links a{border:1px solid var(--ac);border-radius:var(--r);padding:8px 16px;text-decoration:none;font-weight:600}.links a:hover{background:var(--ac);color:var(--bg)}
.hp{width:100%;max-height:360px;object-fit:cover;border-radius:var(--r);margin-bottom:var(--sp);display:block}
.center{text-align:center}.center .bio{margin-inline:auto}.center .links{justify-content:center}
.sec{padding:var(--sp) 0 0}
.sec>h2{font-family:var(--hf);font-size:1.9em;line-height:1.1;margin:0 0 .9em}
.r-line>.sec>h2{border-bottom:1px solid var(--bd);padding-bottom:.4em}
.r-bar>.sec>h2::before{content:"";display:block;width:52px;height:4px;background:var(--ac);margin-bottom:.55em}
.sec>p{max-width:68ch;margin:0 0 1em}
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:20px}
.rows{display:grid;gap:14px}
.card,.row{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.row img{width:100%;max-height:220px;object-fit:cover;display:block}
.cb{padding:18px 20px}
.hd{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.hd h3{font-family:var(--hf);font-size:1.2em;margin:0}.hd span{color:var(--mu);font-size:.85em}
.cb ul{margin:.7em 0 0;padding-left:1.2em}.cb li{margin:.3em 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:.9em 0 0}
.tags span{font-size:.8em;padding:2px 10px;border:1px solid var(--bd);border-radius:99px;color:var(--mu)}
footer{margin-top:var(--sp);padding-top:20px;border-top:1px solid var(--bd);color:var(--mu);font-size:.85em}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

/* editor */
#ed{display:none;position:fixed;top:0;right:0;bottom:0;width:360px;z-index:50;flex-direction:column;background:#f6f7f8;color:#1c2024;font:13px/1.4 system-ui,sans-serif;border-left:1px solid #c9ced3}
body.editing #ed{display:flex}body.editing{padding-right:360px}
#ed *{font-family:inherit}
.eh{padding:10px 14px;background:#fff;border-bottom:1px solid #d9dde1}
.eh b{font-size:14px}.btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#ed button{border:1px solid #b9c0c7;background:#fff;border-radius:5px;padding:5px 10px;cursor:pointer;font-size:12px;color:#1c2024}
#ed button:hover{background:#eceff2}#ed button.p{background:#0b5cad;border-color:#0b5cad;color:#fff}#ed button.on{background:#1c2024;color:#fff}
.eb{overflow:auto;flex:1;padding:4px 14px 40px}
#ed label{display:block;margin:9px 0;font-weight:600;font-size:12px}
#ed input:not([type=color],[type=checkbox],[type=range],[type=file]),#ed textarea,#ed select{display:block;width:100%;margin-top:3px;padding:6px 8px;border:1px solid #b9c0c7;border-radius:5px;background:#fff;font-weight:400;font-size:13px}
#ed input[type=color]{display:block;width:100%;height:30px;margin-top:3px;padding:0;border:1px solid #b9c0c7;border-radius:5px}
#ed input[type=range]{width:100%;display:block}#ed label.ck{display:flex;gap:8px;align-items:center}
#ed output{font-weight:400;color:#5a636c}
details{background:#fff;border:1px solid #d9dde1;border-radius:6px;margin:8px 0;padding:0 10px}
details details{background:#f6f7f8}
summary{cursor:pointer;padding:9px 0;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ct{display:flex;gap:3px}.ct button{padding:2px 7px!important}
#ed h4{margin:14px 0 4px;font-size:12px;color:#5a636c}
@media(max-width:900px){body.editing{padding:0 0 55vh}#ed{top:auto;width:100%;height:55vh;border-left:0;border-top:1px solid #c9ced3}}
</style>

<script id="data" type="application/json">{"theme":{"bg":"#123a5c","bg2":"#0a2540","grad":true,"ang":170,"sf":"#1b4b75","tx":"#eef6fc","mu":"#a9c4da","ac":"#7fd1ff","gr":false,"hf":"Inter","bf":"Merriweather","fs":17,"lh":1.6,"al":"center","w":1000,"sp":68,"r":7,"cols":2,"rule":"line","nav":true},"hero":{"name":"Royce Huynh","sub":"Mechanical engineering student at Boston University, class of 2028","bio":"I design, model, and build mechanical systems, from laser-cut enclosures to fibreglass race-car bodywork.","links":"Email | mailto:rhuynh1@bu.edu\nResume | resume.pdf","img":""},"sections":[{"title":"About","show":true,"layout":"text","body":"I'm a Menino Scholar studying mechanical engineering at Boston University (GPA 3.62). I like owning a part from CAD model to finished hardware: SolidWorks and Fusion 360 for design, laser cutters, mills and 3D printers for fabrication, and MATLAB or Arduino to check that it works.\nCurrent coursework: Differential Equations, Material Science, Probability & Statistics, and Thermodynamics.","items":[]},{"title":"Projects","show":true,"layout":"cards","body":"","items":[{"title":"Automatic Color Sorter","date":"Sep 2025 – Dec 2025 · Mechanical Lead","desc":"Designed an M&M/Skittle sorter enclosure in CAD with multiple sensors, motors, and a conveyor belt system, and laser-cut the housing.\nCoordinated final assembly, integrating all components and circuitry into a fully functioning system.\nStayed within a $200 budget and designed complex 3D-printed parts and assemblies.","tags":"CAD, Laser cutting, 3D printing, Team lead","img":""},{"title":"Acrylic Truss Design","date":"Jan 2025 – May 2025","desc":"Managed design and construction of an acrylic truss with a loading capacity 130% above the minimum requirement (42.38 oz).\nWrote a MATLAB verification algorithm from acrylic strength data to run critical member analysis and optimize load and load-to-cost ratio.","tags":"MATLAB, Structures, Optimization","img":""},{"title":"Temperature Sensor Box","date":"Feb 2025 – Apr 2025","desc":"Programmed an Arduino Uno to read a TMP-36 sensor and alert users to temperature changes.\nDesigned the CAD enclosure and wired and soldered every component.","tags":"Arduino, Soldering, CAD","img":""},{"title":"Terrier Motorsport","date":"Sep 2024 – Present · Aerodynamics/Bodyworks","desc":"Modelled brackets and nosecones in SolidWorks and Fusion 360.\nBuilt a push-bar with manual and waterjet mills and welding.\nManufactured the car's fibreglass nosecone from foam sheets, automotive bondo, and fibreglass.","tags":"SolidWorks, Fusion 360, Welding, Composites","img":""}]},{"title":"Experience","show":true,"layout":"list","body":"","items":[{"title":"Secretary, Society of Asian Scientists and Engineers","date":"Sep 2024 – Present","desc":"Organized events with 100+ attendees and ran a biweekly MailChimp newsletter.\nLaunched fundraisers generating over $1,600 in sales, plus a large-scale merchandise launch.","tags":"","img":""},{"title":"Tutor Mentor, BU Upward Bound","date":"Jun 2025 – Aug 2025","desc":"Mentored 7 high school students through an engineering lab and a successful final presentation.\nDesigned group activities to boost engagement.","tags":"","img":""},{"title":"Assistant, BU Interlibrary Loan Office","date":"Sep 2024 – Present","desc":"Handled every step of the loan process: receiving books, writing condition reports, photographing, checking out and in, and retrieving books.","tags":"","img":""}]},{"title":"Skills","show":true,"layout":"list","body":"","items":[{"title":"CAD & design","date":"","desc":"","tags":"SolidWorks, Fusion 360, Onshape, Bambu Studio","img":""},{"title":"Fabrication","date":"","desc":"","tags":"Laser cutting & engraving, Manual mill, CNC machining, 3D printing, Welding","img":""},{"title":"Programming & tools","date":"","desc":"","tags":"MATLAB, Python, Java, JavaScript, Arduino Uno, Office, Google Suite","img":""}]}],"footer":"© 2026 Royce Huynh · Boston, MA"}</script>
<script>
const $=s=>document.querySelector(s),ed=$('#ed');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o)),DEF=JSON.parse($('#data').textContent),KEY='portfolio-draft';
let S=clone(DEF),tab='style';const OPEN=new Set(['c']);
const editing=()=>location.hash==='#edit';
if(editing())try{const d=localStorage.getItem(KEY);if(d)S=JSON.parse(d)}catch(e){}
const get=p=>p.split('.').reduce((o,k)=>o?.[k],S);
const set=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
const lines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
const safe=u=>/^\s*javascript:/i.test(u||'')?'#':(u||'#');
const FONTS=['Space Grotesk','IBM Plex Sans','IBM Plex Mono','Inter','DM Sans','Poppins','Oswald','Playfair Display','Merriweather','Roboto Mono','system-ui'];
const PRE={Blueprint:{bg:'#123a5c',bg2:'#0a2540',grad:true,sf:'#1b4b75',tx:'#eef6fc',mu:'#a9c4da',ac:'#7fd1ff'},
Vellum:{bg:'#f2f4f6',bg2:'#dfe5ea',grad:false,sf:'#ffffff',tx:'#1d252c',mu:'#5b6773',ac:'#c8102e'},
Graphite:{bg:'#2a2d31',bg2:'#16181b',grad:true,sf:'#33373c',tx:'#f1f1ee',mu:'#a3a8ad',ac:'#ff8a3d'}};

function item(x,lay){
 const u=lines(x.desc),tg=String(x.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
 return `<article class="${lay=='list'?'row':'card'}">${x.img?`<img src="${esc(x.img)}" alt="${esc(x.title)}">`:''}<div class="cb"><div class="hd"><h3>${esc(x.title)}</h3><span>${esc(x.date)}</span></div>${u.length?`<ul>${u.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}${tg.length?`<p class="tags">${tg.map(t=>`<span>${esc(t)}</span>`).join('')}</p>`:''}</div></article>`}
function site(){
 const t=S.theme,h=S.hero,v=S.sections.filter(s=>s.show);
 const links=lines(h.links).map(l=>{const[a,b]=l.split('|').map(x=>x.trim());return `<a href="${esc(safe(b))}">${esc(a)}</a>`}).join('');
 $('#site').className='r-'+t.rule;
 $('#site').innerHTML=(t.nav?`<nav>${v.map((s,i)=>`<a href="#s${i}">${esc(s.title)}</a>`).join('')}</nav>`:'')+
 `<header class="hero ${t.al=='center'?'center':''}">${h.img?`<img class="hp" src="${esc(h.img)}" alt="">`:''}<h1>${esc(h.name)}</h1><p class="sub">${esc(h.sub)}</p><p class="bio">${esc(h.bio)}</p><div class="links">${links}</div></header>`+
 v.map((s,i)=>`<section class="sec" id="s${i}"><h2>${esc(s.title)}</h2>${s.layout=='text'?lines(s.body).map(p=>`<p>${esc(p)}</p>`).join(''):`<div class="${s.layout=='cards'?'grid':'rows'}">${s.items.map(x=>item(x,s.layout)).join('')}</div>`}</section>`).join('')+
 `<footer>${esc(S.footer)}</footer>`}
function theme(){
 const t=S.theme;
 $('#theme').textContent=`:root{--bg:${t.bg};--sf:${t.sf};--tx:${t.tx};--mu:${t.mu};--ac:${t.ac};--hf:'${t.hf}',system-ui,sans-serif;--bf:'${t.bf}',system-ui,sans-serif;--fs:${t.fs}px;--lh:${t.lh};--r:${t.r}px;--w:${t.w}px;--sp:${t.sp}px;--cols:${t.cols};--bd:color-mix(in srgb,${t.tx} 20%,transparent)}body{background:${t.grad?`linear-gradient(${t.ang}deg,${t.bg},${t.bg2})`:t.bg} fixed}`;
 document.body.classList.toggle('grid',!!t.gr);
 const f=[...new Set([t.hf,t.bf])].filter(x=>x!='system-ui').map(x=>'family='+x.replace(/ /g,'+')+':wght@400;600;700').join('&');
 let l=$('#gf');if(!l){l=document.createElement('link');l.id='gf';l.rel='stylesheet';document.head.appendChild(l)}
 l.href=f?`https://fonts.googleapis.com/css2?${f}&display=swap`:''}
function upd(){try{if(editing())localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}theme();site()}

const F={
 t:(l,p,x='text')=>`<label>${l}<input type="${x}" data-p="${p}" value="${esc(get(p))}"></label>`,
 a:(l,p,r=3)=>`<label>${l}<textarea rows="${r}" data-p="${p}">${esc(get(p))}</textarea></label>`,
 r:(l,p,a,b,s=1)=>`<label>${l} <output>${get(p)}</output><input type="range" min="${a}" max="${b}" step="${s}" data-p="${p}" value="${get(p)}"></label>`,
 s:(l,p,o)=>`<label>${l}<select data-p="${p}">${o.map(x=>{const[v,n]=Array.isArray(x)?x:[x,x];return `<option value="${v}"${get(p)==v?' selected':''}>${n}</option>`}).join('')}</select></label>`,
 k:(l,p)=>`<label class="ck"><input type="checkbox" data-p="${p}"${get(p)?' checked':''}>${l}</label>`,
 i:(l,p)=>{const v=String(get(p)||'');return `<label>${l}<input data-p="${p}" placeholder="${v.startsWith('data:')?'(uploaded image)':'Image URL or upload below'}" value="${v.startsWith('data:')?'':esc(v)}"></label><div class="btns"><input type="file" accept="image/*" data-up="${p}"><button data-a="clr" data-p="${p}">Remove</button></div>`}};
const D=(k,title,body,ctl='')=>`<details data-k="${k}"${OPEN.has(k)?' open':''}><summary><span>${esc(title)}</span>${ctl}</summary>${body}</details>`;
const mv=(p,i)=>`<span class="ct"><button data-a="mv" data-p="${p}" data-i="${i}" data-d="-1" title="Move up">↑</button><button data-a="mv" data-p="${p}" data-i="${i}" data-d="1" title="Move down">↓</button><button data-a="rm" data-p="${p}" data-i="${i}" title="Delete">✕</button></span>`;

function build(){
 const sc=$('.eb')?.scrollTop||0,T='theme.';
 const style=`<h4>Presets (colors only)</h4><div class="btns">${Object.keys(PRE).map(k=>`<button data-a="pre" data-k="${k}">${k}</button>`).join('')}</div>`+
 D('c','Colors & background',F.t('Background',T+'bg','color')+F.k('Gradient background',T+'grad')+F.t('Gradient end',T+'bg2','color')+F.r('Gradient angle',T+'ang',0,360,5)+F.t('Card surface',T+'sf','color')+F.t('Text',T+'tx','color')+F.t('Muted text',T+'mu','color')+F.t('Accent',T+'ac','color')+F.k('Blueprint grid overlay',T+'gr'))+
 D('f','Fonts & typography',F.s('Heading font',T+'hf',FONTS)+F.s('Body font',T+'bf',FONTS)+F.r('Base size (px)',T+'fs',14,22)+F.r('Line height',T+'lh',1.2,2,.05))+
 D('l','Layout & spacing',F.r('Page width (px)',T+'w',720,1400,20)+F.r('Section spacing (px)',T+'sp',24,160,4)+F.r('Corner radius (px)',T+'r',0,32)+F.r('Card columns',T+'cols',1,4)+F.s('Intro alignment',T+'al',['left','center'])+F.s('Heading style',T+'rule',[['bar','Accent bar'],['line','Underline'],['none','Plain']])+F.k('Show top navigation',T+'nav'));
 const content=D('h','Intro',F.t('Name','hero.name')+F.t('Subtitle','hero.sub')+F.a('Short bio','hero.bio')+F.a('Links (Label | URL, one per line)','hero.links')+F.i('Intro photo (optional)','hero.img'))+
 '<h4>Sections</h4>'+S.sections.map((s,i)=>{const p=`sections.${i}.`;
  return D('s'+i,s.title+(s.show?'':' (hidden)'),F.t('Title',p+'title')+F.s('Layout',p+'layout',[['cards','Card grid'],['list','List rows'],['text','Text']])+F.k('Show section',p+'show')+
  (s.layout=='text'?F.a('Text (one paragraph per line)',p+'body',6):s.items.map((x,j)=>{const q=`${p}items.${j}.`;
   return D(`s${i}i${j}`,x.title||'Untitled',F.t('Title',q+'title')+F.t('Date / role',q+'date')+F.a('Details (one bullet per line)',q+'desc',4)+F.t('Tags (comma separated)',q+'tags')+F.i('Photo',q+'img'),mv(p+'items',j))}).join('')+`<div class="btns"><button data-a="add" data-p="sections.${i}.items">+ Add card / row</button></div>`),mv('sections',i))}).join('')+
 `<div class="btns"><button data-a="add" data-p="sections">+ Add section</button></div>`+F.t('Footer text','footer');
 ed.innerHTML=`<div class="eh"><b>Portfolio editor</b><div class="btns"><button class="p" data-a="exp">Export index.html</button><button data-a="rst">Reset</button><button data-a="x">Close</button></div><div class="btns"><button data-a="tab" data-k="style" class="${tab=='style'?'on':''}">Style</button><button data-a="tab" data-k="content" class="${tab=='content'?'on':''}">Content</button></div></div><div class="eb">${tab=='style'?style:content}</div>`;
 $('.eb').scrollTop=sc}

ed.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;
 set(p,t.type=='checkbox'?t.checked:t.type=='range'?+t.value:t.value);
 const o=t.parentNode.querySelector('output');if(o)o.textContent=t.value;upd()});
ed.addEventListener('change',e=>{const t=e.target,p=t.dataset.up;if(!p||!t.files[0])return;
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);set(p,c.toDataURL('image/jpeg',.82));upd();build()};im.src=r.result};r.readAsDataURL(t.files[0])});
ed.addEventListener('toggle',e=>{const d=e.target,k=d.dataset?.k;if(k)d.open?OPEN.add(k):OPEN.delete(k)},true);
ed.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;e.preventDefault();
 const{a,p,i,d,k}=b.dataset;
 if(a=='exp')return exp();
 if(a=='x'){history.replaceState(null,'',location.pathname);document.body.classList.remove('editing');return}
 if(a=='tab')tab=k;
 if(a=='pre')Object.assign(S.theme,PRE[k]);
 if(a=='mv'){const A=get(p),j=+i+ +d;if(A[j])[A[i],A[j]]=[A[j],A[i]]}
 if(a=='rm')get(p).splice(i,1);
 if(a=='clr')set(p,'');
 if(a=='add')get(p).push(p=='sections'?{title:'New section',show:true,layout:'cards',body:'',items:[{title:'New item',date:'',desc:'',tags:'',img:''}]}:{title:'New item',date:'',desc:'',tags:'',img:''});
 if(a=='rst'){if(!confirm('Discard all edits and go back to the saved version?'))return;S=clone(DEF);try{localStorage.removeItem(KEY)}catch(x){}}
 upd();build()});

function exp(){
 const d=document.documentElement.cloneNode(true);
 d.querySelector('#site').innerHTML='';d.querySelector('#site').className='';
 d.querySelector('#ed').innerHTML='';d.querySelector('#theme').textContent='';
 d.querySelector('#gf')?.remove();d.querySelector('body').className='';
 d.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+d.outerHTML],{type:'text/html'}));
 a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function open(){if(editing()){try{const d=localStorage.getItem(KEY);if(d)S=JSON.parse(d)}catch(e){}document.body.classList.add('editing');upd();build()}}
addEventListener('hashchange',open);
upd();open();
</script>
